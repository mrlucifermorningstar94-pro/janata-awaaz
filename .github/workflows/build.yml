name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Scaffold and Bypass Metadata Check
        run: |
          flutter create . --platforms=android --project-name janata_awaaz --org com.janata.awaaz
          cat << 'EOF' >> android/app/build.gradle

          gradle.projectsEvaluated {
              tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataWorkAction).configureEach {
                  enabled = false
              }
              tasks.matching { it.name.contains("AarMetadata") }.configureEach {
                  enabled = false
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
