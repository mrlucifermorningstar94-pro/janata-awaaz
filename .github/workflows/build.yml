name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          flutter create -t app --project-name janata_awaaz --org com.janata.awaaz app_workspace
          cp lib/main.dart app_workspace/lib/main.dart
          cp pubspec.yaml app_workspace/pubspec.yaml
          
          [ -d "assets" ] && cp -r assets app_workspace/ || true
          [ -d "android/app/src/main/res" ] && cp -r android/app/src/main/res app_workspace/android/app/src/main/ || true
          
          cd app_workspace

          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.10"/' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.10'/" android/build.gradle || true

          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app_workspace/build/app/outputs/flutter-apk/app-debug.apk
