name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          flutter create -t app --org com.janata.awaaz app_workspace
          cp lib/main.dart app_workspace/lib/main.dart
          cp pubspec.yaml app_workspace/pubspec.yaml
          
          cd app_workspace
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app_workspace/build/app/outputs/flutter-apk/app-debug.apk
