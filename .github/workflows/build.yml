name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Scaffold and Configure Android 10+
        run: |
          flutter create . --platforms=android --project-name janata_awaaz --org com.janata.awaaz
          # build.gradle ma direct navu Android (compileSdk 35, minSdk 29) set karvu
          python3 -c "
          import re
          p = 'android/app/build.gradle'
          try:
              with open(p, 'r') as f:
                  text = f.read()
              text = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', text)
              text = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 29', text)
              text = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 35', text)
              with open(p, 'w') as f:
                  f.write(text)
          except Exception as e:
              pass
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
