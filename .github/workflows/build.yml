name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          # 1. Gradle AarMetadata check સંપૂર્ણપણે બંધ કરવું
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/disable-aar-check.gradle
          allprojects {
              tasks.whenTaskAdded { task ->
                  if (task.name.toLowerCase().contains("aarmetadata")) {
                      task.enabled = false
                  }
              }
          }
          EOF

          # 2. સ્વચ્છ પ્રોજેક્ટ ઊભો કરવો
          flutter create -t app --org com.janata.awaaz app_workspace
          cp lib/main.dart app_workspace/lib/main.dart
          cp pubspec.yaml app_workspace/pubspec.yaml

          # 3. Lifecycle નો વિવાદ રોકવો
          cat << 'EOF' >> app_workspace/pubspec.yaml

          dependency_overrides:
            flutter_plugin_android_lifecycle: 2.0.22
          EOF

          # 4. સેવ કરીને સીધું APK બનાવવું
          cd app_workspace
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties

          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app_workspace/build/app/outputs/flutter-apk/app-debug.apk
