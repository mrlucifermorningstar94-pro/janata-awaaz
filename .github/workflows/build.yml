name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project and Update SDK Settings
        run: |
          flutter create . --platforms=android --org com.janata.awaaz
          python3 -c "
          import os
          for root, dirs, files in os.walk('android'):
              for f in files:
                  if f.startswith('build.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r') as file:
                          content = file.read()
                      content = content.replace('flutter.compileSdkVersion', '36')
                      content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                      content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                      content = content.replace('flutter.minSdkVersion', '21')
                      content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                      content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                      with open(p, 'w') as file:
                          file.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
