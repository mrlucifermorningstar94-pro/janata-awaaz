name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean Flutter App
        run: |
          # 1. ફ્લટરનો તાજો અને સાચો પ્રોજેક્ટ અલગ ફોલ્ડરમાં બનાવો
          flutter create -t app --org com.janata.awaaz app_workspace
          
          # 2. તમારા મૂળ કોડ અને ડિપેન્ડન્સી ફાઇલોને નવા પ્રોજેક્ટમાં ખસેડો
          cp lib/main.dart app_workspace/lib/main.dart
          cp pubspec.yaml app_workspace/pubspec.yaml
          
          # 3. એન્ડ્રોઇડ સેટિંગ્સ ફિક્સ કરો
          cd app_workspace
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "android.disableMinCompileSdkCheck=true" >> android/gradle.properties
          
          # 4. ડિપેન્ડન્સી લાવી APK બિલ્ડ કરો
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app_workspace/build/app/outputs/flutter-apk/app-debug.apk
